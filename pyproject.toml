[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schrody-sensor-tools"
version = "0.1.0"
description = "Python tooling environment for schrody-sensor firmware development"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "esphome>=2026.4.0,<2027.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]
