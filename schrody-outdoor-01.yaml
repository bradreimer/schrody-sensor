esphome:
  name: schrody-outdoor-01
  friendly_name: Schrody Outdoor 01
  comment: DHT22 outdoor node in temporary Wi-Fi mode until Thread border router is available.

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: n
      CONFIG_ESP_CONSOLE_UART_DEFAULT: y
  # Run at minimum supported frequency to reduce active-period current draw.
  cpu_frequency: 80MHz

# Thread-disabled temporary networking mode.
network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Schrody-Outdoor-01 Fallback"
    password: !secret ota_password

captive_portal:

# OpenThread disabled until a valid Thread dataset TLV is provided in secrets.
# Current invalid dataset values can cause esp_openthread_auto_start() to fail
# and trigger a software-reset boot loop.
# openthread:
#   tlv: !secret thread_dataset_tlv
#   device_type: MTD
#   poll_period: 5min

api:
  encryption:
    key: !secret api_key_outdoor

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: dht
    pin: GPIO7
    model: DHT22
    update_interval: 5min
    temperature:
      name: Outdoor Temperature
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: Outdoor Humidity
      device_class: humidity
      state_class: measurement
      unit_of_measurement: "%"
      accuracy_decimals: 1
