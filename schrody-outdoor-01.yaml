esphome:
  name: schrody-outdoor-01
  friendly_name: Schrody Outdoor 01
  comment: DHT22 temperature and humidity sensor on GPIO7, Thread Sleepy End Device for battery life.

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf
  # Run at minimum supported frequency to reduce active-period current draw.
  cpu_frequency: 80MHz

# Enable logging
logger:

# Enable Home Assistant API (communicates over Thread/IPv6)
api:
  encryption:
    key: !secret api_key

# NOTE: ESPHome native OTA does not work when openthread poll_period > 0.
# To perform an OTA update, temporarily set poll_period to 0 and reflash via serial.
ota:
  - platform: esphome
    password: !secret ota_password

# Thread requires IPv6 networking.
network:
  enable_ipv6: true

# OpenThread for Thread connectivity (native ESPHome API over IPv6).
# device_type MTD + poll_period makes this a Sleepy End Device (SED): the parent
# Thread router enqueues messages and waits for the device to poll, keeping the
# 802.15.4 radio off between intervals instead of actively listening.
# This is the primary battery-life mechanism for Thread-connected sensors.
openthread:
  # Paste the dataset TLV from Home Assistant (Settings -> System -> Thread).
  tlv: !secret thread_dataset_tlv
  device_type: MTD
  poll_period: 5min

sensor:
  - platform: dht
    pin: GPIO7
    model: DHT22
    update_interval: 5min
    temperature:
      name: Outdoor Temperature
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: Outdoor Humidity
      device_class: humidity
      state_class: measurement
      unit_of_measurement: "%"
      accuracy_decimals: 1
